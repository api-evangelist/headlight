aid: headlight
name: Headlight
description: 'Headlight is a US mental health services company delivering teletherapy,
  in-person therapy, psychiatry, and medication management through a clinician-centered
  care model. Founded by Drs. Manish Sheth and Shashita Inamdar, it helps patients
  move from initial interest to a well-matched therapist or prescriber with less friction,
  treating conditions including depression, anxiety, ADHD, bipolar disorder, PTSD,
  trauma, OCD, panic disorder, postpartum depression, and insomnia. Headlight is in-network
  with major insurers (Aetna, Blue Cross, Cigna, UnitedHealthcare, Humana, Kaiser,
  Moda) and operates across Alaska, California, Colorado, Oregon, Texas, and Washington.
  The company raised $18M led by Matrix and EPIC Ventures. This is a consumer clinical
  services provider with no public developer API surface.'
